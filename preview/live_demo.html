    // 1. WEB AUDIO API CHIME SYNTHESIZER
    // =========================================================================
    function useAudioChime(shouldRing) {
      const [isMuted, setIsMuted] = useState(false);
      const [isRinging, setIsRinging] = useState(false);
      const audioCtxRef = useRef(null);
      const timerRef = useRef(null);

      const getCtx = useCallback(() => {
        if (!audioCtxRef.current) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtxRef.current = new AudioContextClass();
        }
        if (audioCtxRef.current && audioCtxRef.current.state === 'suspended') {
          audioCtxRef.current.resume();
        }
        return audioCtxRef.current;
      }, []);

      const playChime = useCallback(() => {
        if (isMuted) return;
        const ctx = getCtx();
        if (!ctx) return;
        try {
          const now = ctx.currentTime;
          // C5 Note
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.frequency.setValueAtTime(523.25, now);
          gain1.gain.setValueAtTime(0.3, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.4);

          // G5 Note delayed
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.frequency.setValueAtTime(783.99, now + 0.13);
          gain2.gain.setValueAtTime(0.35, now + 0.13);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.13);
          osc2.stop(now + 0.65);
        } catch (e) {}
      }, [isMuted, getCtx]);

      useEffect(() => {
        if (shouldRing && !isMuted) {
          playChime();
          setIsRinging(true);
          timerRef.current = setInterval(playChime, 1800);
        } else {
          if (timerRef.current) clearInterval(timerRef.current);
          timerRef.current = null;
          setIsRinging(false);
        }
        return () => {
          if (timerRef.current) clearInterval(timerRef.current);
        };
      }, [shouldRing, isMuted, playChime]);

      return { isRinging, isMuted, toggleMute: () => setIsMuted(m => !m), playChime };
    }

                    </div>
                  )}

                  {/* 5. Image Upload & Compression Section */}
                  <div>
                    <label className="block text-slate-300 font-bold mb-1.5">
                      Product Photo (फोटो अपलोड या चुनें) *
                    </label>

                    <div className="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 flex items-center gap-4 mb-3">
                      <img
                        src={newProdImage}
                        alt="Preview"
                        className="w-20 h-20 rounded-xl object-cover border border-slate-600 bg-slate-900 shrink-0"
                      />
                      <div className="flex-1 min-w-0 space-y-1.5">
                        <div className="flex items-center gap-2">
                          <label className="bg-sky-600 hover:bg-sky-500 text-white font-bold px-3.5 py-2 rounded-xl text-xs cursor-pointer shadow transition inline-flex items-center gap-1.5">
                            <span>📸</span>
                            <span>Take Photo / Upload</span>
                            <input
                              type="file"
                              accept="image/*"
                              capture="environment"
                              onChange={handleNewProdFile}
                              className="hidden"
                            />
                          </label>
                          {isCompressingImage && (
                            <span className="text-xs text-sky-400 font-bold animate-pulse">Compressing via Canvas...</span>
                          )}
                        </div>
                        <div className="text-[11px] text-slate-400 font-mono">{compressionReport}</div>
                      </div>
                    </div>

                    {/* Quick Kirana Photo Presets */}
                    <div className="text-slate-400 font-bold text-[11px] mb-1.5">Or tap popular kirana photo preset:</div>
                    <div className="grid grid-cols-4 gap-2">
                      {KIRANA_DEMO_PRESETS.map(preset => (
                        <button
                          key={preset.id}
                          type="button"
                          onClick={() => {
                            setNewProdImage(preset.url);
                            setNewProdPresetId(preset.id);
                            if (!newProdLocalized && preset.hi) setNewProdLocalized(preset.hi);
                          }}
                          className={`p-1.5 rounded-xl border text-center transition ${
                            newProdPresetId === preset.id
                              ? 'bg-sky-950 border-sky-400 shadow'
                              : 'bg-slate-800 border-slate-700 hover:border-slate-600'
                          }`}
                        >
                          <img src={preset.url} alt={preset.label} className="w-full h-12 rounded-lg object-cover mb-1" />
                          <div className="text-[10px] font-bold text-slate-200 truncate">{preset.label}</div>
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Footer */}
                <div className="p-4 bg-slate-950 border-t border-slate-800 flex items-center justify-end gap-3">
                  <button
                    type="button"
                    onClick={() => setShowAddProductModal(false)}
                    className="px-5 py-2.5 rounded-xl border border-slate-700 text-slate-300 hover:text-white font-bold text-xs"
                  >
                    Cancel (रद्द करें)
                  </button>
                  <button
                    type="button"
                    onClick={handleSaveNewProduct}
                    disabled={isCompressingImage}
                    className="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs shadow-lg transition active:scale-95"
                  >
                    ✨ Add to Store Catalog (स्टोर में जोड़ें)
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<LiveDemoApp />);
  </script>
</body>
</html>
