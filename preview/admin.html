    // --- Web Audio API Chime Hook Implementation ---
    function useAudioAlert(shouldRing) {
      const [isMuted, setIsMuted] = useState(false);
      const [isRinging, setIsRinging] = useState(false);
      const audioCtxRef = useRef(null);
      const timerRef = useRef(null);

      const getCtx = useCallback(() => {
        if (!audioCtxRef.current) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtxRef.current = new AudioContextClass();
        }
        if (audioCtxRef.current && audioCtxRef.current.state === 'suspended') {
          audioCtxRef.current.resume();
        }
        return audioCtxRef.current;
      }, []);

      const playChime = useCallback(() => {
        if (isMuted) return;
        const ctx = getCtx();
        if (!ctx) return;
        try {
          const now = ctx.currentTime;
          // Note 1: C5 (523.25 Hz)
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.frequency.setValueAtTime(523.25, now);
          gain1.gain.setValueAtTime(0.3, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.4);

          // Note 2: G5 (783.99 Hz) delayed by 130ms
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.frequency.setValueAtTime(783.99, now + 0.13);
          gain2.gain.setValueAtTime(0.35, now + 0.13);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.13);
          osc2.stop(now + 0.65);
        } catch (e) {}
      }, [isMuted, getCtx]);

      useEffect(() => {
        if (shouldRing && !isMuted) {
          playChime();
          setIsRinging(true);
          timerRef.current = setInterval(playChime, 1800);
        } else {
          if (timerRef.current) clearInterval(timerRef.current);
          timerRef.current = null;
          setIsRinging(false);
        }
        return () => {
          if (timerRef.current) clearInterval(timerRef.current);
        };
      }, [shouldRing, isMuted, playChime]);

      const toggleMute = () => setIsMuted(m => !m);

      return { isRinging, isMuted, toggleMute, playChime };
    }

                  >
                    Save All Settings ✓
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* Quick Edit Price Modal */}
          {editingProduct && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-5 z-50">
              <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl text-slate-900">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="text-base font-black">Update Price</h3>
                  <button onClick={() => setEditingProduct(null)} className="text-slate-400 font-bold">✕</button>
                </div>

                <p className="text-xs text-slate-500 mb-4">{editingProduct.name} ({editingProduct.unit})</p>

                <div className="grid grid-cols-2 gap-3 mb-5">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">MRP (₹)</label>
                    <input
                      type="number"
                      value={editMrp}
                      onChange={(e) => setEditMrp(e.target.value)}
                      className="w-full bg-slate-100 border rounded-xl px-3 py-2 text-sm font-bold"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Selling (₹)</label>
                    <input
                      type="number"
                      value={editPrice}
                      onChange={(e) => setEditPrice(e.target.value)}
                      className="w-full bg-emerald-50 border border-emerald-400 rounded-xl px-3 py-2 text-sm font-black text-emerald-800"
                    />
                  </div>
                </div>

                <div className="flex gap-2">
                  <button onClick={() => setEditingProduct(null)} className="flex-1 py-2.5 rounded-xl border text-xs font-bold text-slate-600">
                    Cancel
                  </button>
                  <button onClick={saveEditedPrice} className="flex-1 py-2.5 rounded-xl bg-emerald-700 text-white text-xs font-bold shadow">
                    Save Price ✓
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Self-Serve Add Product Modal */}
          {showAddModal && (
            <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-5 z-50">
              <div className="bg-white rounded-3xl w-full max-w-xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-slide-down">
                {/* Header */}
                <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                  <div>
                    <h3 className="text-base font-black text-slate-900 flex items-center gap-2">
                      <span>➕</span> Add New Product
                    </h3>
                    <p className="text-xs text-slate-500">नया सामान स्टोर इन्वेंटरी में जोड़ें</p>
                  </div>
                  <button
                    onClick={() => setShowAddModal(false)}
                    className="w-8 h-8 rounded-full bg-slate-200 text-slate-600 hover:bg-slate-300 flex items-center justify-center font-bold text-sm"
                  >
                    ✕
                  </button>
                </div>

                {/* Form Body */}
                <div className="flex-1 overflow-y-auto p-6 space-y-4 text-xs no-scrollbar text-slate-700">
                  {addError && (
                    <div className="p-3 bg-red-50 border border-red-300 rounded-xl text-red-600 font-bold">
                      ⚠️ {addError}
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">
                        Product Name (English) <span className="text-red-500">*</span>
                      </label>
                      <input
                        type="text"
                        placeholder="e.g., Tata Salt Vacuum Evaporated"
                        value={newProdName}
                        onChange={(e) => setNewProdName(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-slate-900 font-medium text-xs outline-none focus:border-emerald-600"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">
                        Product Name (Hindi / Local) <span className="text-slate-400 font-normal">(वैकल्पिक)</span>
                      </label>
                      <input
                        type="text"
                        placeholder="उदा., टाटा नमक आयोडीन"
                        value={newProdLocalized}
                        onChange={(e) => setNewProdLocalized(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-slate-900 font-medium text-xs outline-none focus:border-emerald-600"
                      />
                    </div>
                  </div>

                  {/* Category Chips */}
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Category (श्रेणी) *</label>
                    <div className="grid grid-cols-3 gap-2">
                      {[
                        { id: 'groceries', label: 'Atta & Dal', icon: '🌾' },
                        { id: 'dairy', label: 'Milk & Bread', icon: '🥛' },
                        { id: 'instant-food', label: 'Noodles & Pasta', icon: '🍜' },
                        { id: 'beverages', label: 'Tea & Coffee', icon: '☕' },
                        { id: 'household', label: 'Cleaning & Soaps', icon: '🧼' },
                        { id: 'snacks', label: 'Biscuits & Snacks', icon: '🍪' }
                      ].map(cat => (
                        <button
                          key={cat.id}
                          type="button"
                          onClick={() => setNewProdCategory(cat.id)}
                          className={`p-2 rounded-xl border flex items-center gap-2 text-left font-bold transition ${
                            newProdCategory === cat.id
                              ? 'bg-emerald-50 border-emerald-600 text-emerald-800 shadow-sm'
                              : 'bg-slate-50 border-slate-200 text-slate-600 hover:border-slate-300'
                          }`}
                        >
                          <span className="text-sm">{cat.icon}</span>
                          <span className="truncate text-xs">{cat.label}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Unit */}
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Unit Size (मात्रा / वजन) *</label>
                    <div className="flex flex-wrap gap-2 mb-2">
                      {['1 kg', '500 g', '250 g', '5 kg', '1 L', '500 ml', 'Pack of 4', '1 pc'].map(u => (
                        <button
                          key={u}
                          type="button"
                          onClick={() => setNewProdUnit(u)}
                          className={`px-3 py-1 rounded-lg border font-bold text-[11px] transition ${
                            newProdUnit === u
                              ? 'bg-emerald-700 border-emerald-700 text-white'
                              : 'bg-slate-100 border-slate-200 text-slate-600 hover:bg-slate-200'
                          }`}
                        >
                          {u}
                        </button>
                      ))}
                    </div>
                    <input
                      type="text"
                      placeholder="Or enter custom unit: e.g., 200 ml, Pack of 6"
                      value={newProdUnit}
                      onChange={(e) => setNewProdUnit(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2 text-slate-900 text-xs outline-none"
                    />
                  </div>

                  {/* Price */}
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">MRP (₹)</label>
                      <input
                        type="number"
                        placeholder="₹ MRP"
                        value={newProdMrp}
                        onChange={(e) => setNewProdMrp(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2 text-slate-900 font-bold text-sm outline-none"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">
                        Selling Price (₹) <span className="text-red-500">*</span>
                      </label>
                      <input
                        type="number"
                        placeholder="₹ Offer Price"
                        value={newProdPrice}
                        onChange={(e) => setNewProdPrice(e.target.value)}
                        className="w-full bg-emerald-50 border border-emerald-500 rounded-xl px-3.5 py-2 text-emerald-800 font-black text-sm outline-none"
                      />
                    </div>
                  </div>

                  {/* Image */}
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Product Photo *</label>
                    <div className="bg-slate-50 border border-slate-200 rounded-2xl p-3 flex items-center gap-4 mb-2">
                      <img
                        src={newProdImage}
                        alt="Preview"
                        className="w-16 h-16 rounded-xl object-cover border bg-white shrink-0"
                      />
                      <div className="flex-1 space-y-1">
                        <label className="bg-slate-800 hover:bg-slate-900 text-white font-bold px-3 py-1.5 rounded-lg text-xs cursor-pointer shadow inline-flex items-center gap-1.5">
                          <span>📸</span>
                          <span>Upload Photo</span>
                          <input
                            type="file"
                            accept="image/*"
                            onChange={handleImageFile}
                            className="hidden"
                          />
                        </label>
                        {isCompressing && <span className="text-xs text-sky-600 font-bold animate-pulse ml-2">Compressing...</span>}
                        <div className="text-[11px] text-slate-500">{compressionNote}</div>
                      </div>
                    </div>

                    <div className="text-slate-500 font-bold text-[11px] mb-1">Or pick quick photo preset:</div>
                    <div className="grid grid-cols-4 gap-2">
                      {KIRANA_PRESETS.map(p => (
                        <button
                          key={p.id}
                          type="button"
                          onClick={() => {
                            setNewProdImage(p.url);
                            setNewProdPresetId(p.id);
                            if (!newProdLocalized && p.hi) setNewProdLocalized(p.hi);
                          }}
                          className={`p-1 rounded-xl border text-center transition ${
                            newProdPresetId === p.id
                              ? 'bg-emerald-50 border-emerald-600'
                              : 'bg-white border-slate-200 hover:border-slate-300'
                          }`}
                        >
                          <img src={p.url} alt={p.label} className="w-full h-10 rounded-lg object-cover mb-0.5" />
                          <div className="text-[10px] font-bold text-slate-700 truncate">{p.label}</div>
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Footer */}
                <div className="p-4 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-3">
                  <button
                    type="button"
                    onClick={() => setShowAddModal(false)}
                    className="px-4 py-2 rounded-xl border border-slate-300 text-slate-600 hover:bg-slate-100 font-bold text-xs"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={handleAddProductSubmit}
                    disabled={isCompressing}
                    className="px-5 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold text-xs shadow transition active:scale-95"
                  >
                    ✨ Add to Catalog ✓
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
  </script>
</body>
</html>
